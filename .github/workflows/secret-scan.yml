name: Secret Scan

# Scanning logic lives in skyfora/secret-scanning. pull_request_target runs this
# file as it is on the default branch, so a PR cannot weaken its own scan.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    uses: skyfora/secret-scanning/.github/workflows/secret-scan.yml@v1
